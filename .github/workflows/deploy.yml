name: Castiglioni — Publicar propuesta
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: castiglioni-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Habilitar GitHub Pages con GitHub Actions
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Empaquetar propuesta
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar demo
        id: deployment
        uses: actions/deploy-pages@v4
