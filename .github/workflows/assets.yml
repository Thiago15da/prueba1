name: Castiglioni — Material visual de la demo
on:
  push:
    paths:
      - ".github/workflows/assets.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect-images:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Guardar imagenes ilustrativas y fotografias institucionales
        run: |
          mkdir -p assets/media
          python3 - <<'PY'
          import urllib.request, time
          from pathlib import Path

          images = {
            "architecture.jpg": [
              "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1500&q=84",
              "https://images.unsplash.com/photo-1487958449943-2429e8be8625?auto=format&fit=crop&w=1400&q=85"
            ],
            "interior.jpg": [
              "https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1500&q=85",
              "https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=1300&q=85"
            ],
            "carmelo.jpg": [
              "https://www.castiglioni.com.py/wp-content/uploads/2024/09/Castiglioni-36-580x580.jpg"
            ],
            "fabrizio.jpg": [
              "https://www.castiglioni.com.py/wp-content/uploads/2024/09/Castiglioni-33-580x580.jpg"
            ]
          }
          essential_failed = []
          for name,urls in images.items():
            output = Path("assets/media",name)
            done = False
            for url in urls:
              try:
                request = urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; NovaTecDemo/1.0)"})
                with urllib.request.urlopen(request,timeout=20) as resp:
                  data = resp.read(5*1024*1024)
                  mime = resp.headers.get("Content-Type","")
                if not (len(data) > 2500 and (data[:3] == b'\xff\xd8\xff' or data.startswith(b'\x89PNG'))):
                  raise ValueError("Invalid image payload: %s / %d bytes"%(mime,len(data)))
                output.write_bytes(data)
                print("OK",name,len(data),mime)
                done = True
                break
              except Exception as error:
                print("Unreachable",name,url,str(error)[:200])
                time.sleep(1)
            if not done:
              print("MISSING",name)
              if name in ("architecture.jpg","interior.jpg"):
                essential_failed.append(name)
          if essential_failed:
            raise SystemExit("Missing essential photographs: "+str(essential_failed))
          PY
      - name: Publicar fotografias en el repositorio
        run: |
          git config user.name "NovaTec Media Bot"
          git config user.email "noreply@users.noreply.github.com"
          git add assets/media
          if ! git diff --cached --quiet; then
            git commit -m "assets: cache architectural references and verified firm portraits"
            git push origin HEAD:main
          fi
